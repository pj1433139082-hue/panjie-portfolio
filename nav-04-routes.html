<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潘杰 / 动态路线图入口</title><style>
:root{--ink:#112121;--paper:#ece8de;--lime:#d9ff2b;--sky:#8ac9d2;--coral:#ef6445;--line:rgba(17,33,33,.25)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(100% - 64px,1560px);margin:auto}.head{height:84px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.14em}.back{min-height:44px;display:flex;align-items:center;padding:0 14px;background:var(--ink);color:var(--paper);transition:background .2s,color .2s}.back:hover,.back:focus-visible{background:var(--coral);outline:none}.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(36px,9vw,160px);padding:clamp(55px,8vw,120px) 0 38px;align-items:end}.intro h1{margin:0;font:clamp(4.5rem,10.3vw,9.6rem)/.78 "Noto Serif SC","Songti SC",serif;letter-spacing:-.095em}.intro h1 i{font-style:normal;color:var(--coral)}.intro p{max-width:28ch;margin:0 0 7px;font:18px/1.7 "Noto Serif SC","Songti SC",serif}.map{position:relative;min-height:595px;border:1px solid var(--ink);overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 59px,var(--line) 60px),repeating-linear-gradient(90deg,transparent 0 59px,var(--line) 60px);isolation:isolate}.photo{position:absolute;right:6.2%;top:9%;width:min(28vw,370px);aspect-ratio:1/1.25;margin:0;border:1px solid var(--ink);z-index:0;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 27%;filter:saturate(.72) contrast(1.03)}.photo figcaption{position:absolute;left:0;bottom:0;background:var(--lime);padding:8px 10px;font-size:10px;letter-spacing:.12em;font-weight:700}.route{appearance:none;position:absolute;z-index:2;border:1px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 22px;font:700 13px/1 "Noto Sans SC","Microsoft YaHei",sans-serif;letter-spacing:.07em;cursor:pointer;transition:background .25s,color .25s,transform .25s}.route:after{content:'';position:absolute;width:clamp(66px,9vw,142px);height:1px;background:var(--ink);transform-origin:left}.route:hover,.route:focus-visible,.route[aria-pressed=true]{background:var(--ink);color:var(--paper);transform:scale(1.07);outline:none}.route.one{top:16%;left:8%}.route.one:after{left:100%;top:50%;transform:rotate(23deg)}.route.two{top:41%;left:28%}.route.two:after{left:100%;top:50%;transform:rotate(-12deg)}.route.three{top:18%;left:53%}.route.three:after{right:100%;top:50%;transform:rotate(166deg)}.route.four{top:68%;left:15%}.route.four:after{left:100%;top:50%;transform:rotate(-21deg)}.route.five{top:74%;left:51%}.route.five:after{right:100%;top:50%;transform:rotate(196deg)}.point{position:absolute;z-index:1;width:17px;height:17px;border-radius:50%;background:var(--coral);left:47%;top:45%;box-shadow:0 0 0 10px rgba(239,100,69,.14)}.readout{position:absolute;z-index:3;left:8%;bottom:10%;max-width:31ch;padding:18px;background:var(--sky);border:1px solid var(--ink);font:15px/1.65 "Noto Serif SC","Songti SC",serif;transform:rotate(-1deg)}.readout b{display:block;margin-bottom:6px;font:700 10px/1 "Noto Sans SC",sans-serif;letter-spacing:.13em}.footer{display:flex;justify-content:space-between;gap:16px;padding:20px 0 38px;font-size:12px;color:#56605c}.fade{opacity:0;transform:translateY(22px);transition:.6s ease}.fade.in{opacity:1;transform:none}@media(max-width:900px){.intro{grid-template-columns:1fr;gap:24px}.map{min-height:700px}.photo{right:7%;top:7%;width:250px}.route.three{top:34%;left:11%}.route.two{top:51%;left:49%}.route.four{top:64%;left:10%}.route.five{top:80%;left:44%}.readout{bottom:7%;left:7%}}@media(max-width:560px){.shell{width:min(100% - 32px,1560px)}.head{height:70px}.intro{padding-top:68px}.intro h1{font-size:4.7rem}.map{min-height:760px}.photo{width:190px;right:6%;top:5%}.route{min-height:48px;padding:0 16px;font-size:12px}.route.one{top:35%;left:6%}.route.three{top:44%;left:42%}.route.two{top:54%;left:7%}.route.four{top:64%;left:44%}.route.five{top:74%;left:8%}.route:after{width:40px}.readout{left:6%;right:6%;bottom:5%;max-width:none;font-size:14px}.footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fade{transition:none;opacity:1;transform:none}.route,.photo{transition:none}}
</style><script defer src="assets/ui-arrows.js"></script></head><body><main class="shell"><header class="head"><b>PAN JIE / WORK ROUTES</b><a class="back" href="navigation-options.html">方案目录 ↗</a></header><section class="intro fade"><h1>从问题<br>走向<i>判断</i>。</h1><p>五条工作路径并不彼此独立：它们都从真实业务出发，经过数据与技术判断，再回到可持续的工程能力。</p></section><section class="map fade" aria-label="作品路线图"><figure class="photo"><img src="assets/panjie-portrait.png" alt="潘杰职业照"><figcaption>PAN JIE / 2026</figcaption></figure><i class="point" aria-hidden="true"></i><button class="route one" data-href="tech.html" data-text="用任务分流、知识检索和协作交付，组织一套可以每天使用的个人工作流。" aria-pressed="true">01 智能体管家</button><button class="route two" data-href="brand.html" data-text="把水务异常排查中的信息检索、引用依据与安全边界组织成协作路径。" aria-pressed="false">02 水务 Agent</button><button class="route three" data-href="minimal.html" data-text="面对预测问题，先判断目标、时间、数据与泛化，再讨论模型复杂度。" aria-pressed="false">03 时序预测</button><button class="route four" data-href="academic.html" data-text="把“模型能跑”推进成项目可评估、可影子运行、可安全协同的能力。" aria-pressed="false">04 AI 工程应用</button><button class="route five" data-href="casual.html" data-text="两段实习构成一条成长线：稳定交付的工程实践，与真实现场的风险认知。" aria-pressed="false">05 现场与成长</button><aside class="readout" aria-live="polite"><b>ROUTE / 01</b><span>用任务分流、知识检索和协作交付，组织一套可以每天使用的个人工作流。</span></aside></section><footer class="footer"><span>动态路线图版 / 点击路径阅读简介，再次点击进入作品页。</span><span>鼠标移动会轻微调整人物图版。</span></footer></main><script>const routes=[...document.querySelectorAll('.route')],out=document.querySelector('.readout'),pic=document.querySelector('.photo');routes.forEach((b,i)=>b.addEventListener('click',()=>{if(b.getAttribute('aria-pressed')==='true'){location.href=b.dataset.href;return}routes.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.innerHTML='<b>ROUTE / 0'+(i+1)+'</b><span>'+b.dataset.text+'</span>'}));if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&matchMedia('(pointer:fine)').matches){document.querySelector('.map').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;pic.style.transform='translate('+x*12+'px,'+y*12+'px)'})}document.querySelectorAll('.fade').forEach((e,i)=>setTimeout(()=>e.classList.add('in'),120+i*160));</script></body></html>
